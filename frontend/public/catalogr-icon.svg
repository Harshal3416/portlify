<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="20" fill="#2c3e50"/>

  <!-- Row 1: gold square + lines -->
  <rect x="12" y="14" width="24" height="24" rx="5" fill="#c9a84c"/>
  <!-- icon inside gold -->
  <rect x="16" y="19" width="6" height="8" rx="1.5" fill="#2c3e50" opacity="0.5"/>
  <rect x="24" y="19" width="8" height="3" rx="1" fill="#2c3e50" opacity="0.45"/>
  <rect x="24" y="24" width="10" height="2.5" rx="1" fill="#2c3e50" opacity="0.3"/>
  <!-- text lines -->
  <rect x="42" y="16" width="46" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="42" y="25" width="32" height="4" rx="2" fill="#c9a84c" opacity="0.75"/>
  <rect x="42" y="32" width="40" height="3" rx="1.5" fill="#ffffff" opacity="0.38"/>

  <!-- Row 2 -->
  <rect x="12" y="44" width="24" height="24" rx="5" fill="#3d5570"/>
  <rect x="16" y="49" width="16" height="10" rx="2.5" fill="#8a9ba8" opacity="0.5"/>
  <rect x="42" y="46" width="38" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="42" y="55" width="46" height="3" rx="1.5" fill="#ffffff" opacity="0.38"/>
  <rect x="42" y="61" width="28" height="3" rx="1.5" fill="#c9a84c" opacity="0.55"/>

  <!-- Row 3 -->
  <rect x="12" y="74" width="24" height="18" rx="5" fill="#3d5570"/>
  <rect x="16" y="79" width="16" height="8" rx="2" fill="#8a9ba8" opacity="0.42"/>
  <rect x="42" y="76" width="50" height="6" rx="3" fill="#ffffff" opacity="0.92"/>
  <rect x="42" y="85" width="34" height="3" rx="1.5" fill="#ffffff" opacity="0.38"/>

  <!-- Bottom CTA pills -->
  <rect x="12" y="96" width="0" height="0" fill="none"/>
</svg>
